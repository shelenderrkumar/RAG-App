[project]
name = "company-rag-chatbot"
version = "1.0.0"
description = "Stateful RAG chatbot: LangGraph human-in-the-loop conversation flow over a company PDF, streamed over WebSockets."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shelender Kumar" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.16.3",
    "langgraph==1.2.24",
    "langchain-core==1.8.4",
    "langchain-openai==1.8.5",
    "langchain-community==0.4.2",
    "langchain-text-splitters==1.1.3",
    "faiss-cpu==1.16.0",
    "pypdf==7.1.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "httpx==0.28.1", "ruff==0.17.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ragchat*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    # Hash-based fake embeddings in tests are not semantically similar; real ones are.
    "ignore:Relevance scores must be between:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
